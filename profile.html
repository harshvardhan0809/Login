<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Update your Exam Portal name and profile picture." />
    <title>Profile Settings · Exam Portal</title>
    <link rel="icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/src/styles/style.css" />
  </head>
  <body>
    <main class="card dashboard-card">
      <header class="page-header">
        <div>
          <p class="eyebrow">Account</p>
          <h1>Profile Settings</h1>
          <p class="sub">Keep your learning profile current.</p>
        </div>
      </header>

      <img id="avatarPreview" class="avatar" alt="Profile picture preview" />

      <form class="form-stack" novalidate>
        <div class="field">
          <label for="nameInput">Name</label>
          <input id="nameInput" placeholder="Your name" autocomplete="name" required />
        </div>

        <div class="field">
          <label for="fileInput">Profile Picture</label>
          <input id="fileInput" type="file" accept="image/*" />
        </div>
      </form>

      <div id="passwordMount"></div>

      <div class="actions">
        <button id="saveBtn" type="button">Save Changes</button>
        <button id="backBtn" type="button" class="secondary">Back to Dashboard</button>
      </div>
    </main>

    <script type="module" src="/src/pages/profile.js"></script>
  </body>
</html>
