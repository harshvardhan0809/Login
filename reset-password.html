<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Choose a new password for your Exam Portal account." />
    <title>Reset Password · Exam Portal</title>
    <link rel="icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/src/styles/style.css" />
  </head>
  <body>
    <main class="card auth-card">
      <div class="logo">Exam Portal</div>
      <h1>Set a new password</h1>
      <p class="sub" id="resetIntro">Checking your reset link...</p>

      <div id="resetForm" hidden>
        <form class="form-stack" novalidate>
          <div class="field">
            <label for="newPassword">New password</label>
            <input
              id="newPassword"
              type="password"
              placeholder="At least 6 characters"
              autocomplete="new-password"
              required
            />
          </div>
          <div class="field">
            <label for="confirmPassword">Confirm password</label>
            <input
              id="confirmPassword"
              type="password"
              placeholder="Repeat the new password"
              autocomplete="new-password"
              required
            />
          </div>
        </form>

        <button id="saveBtn" type="button">Save New Password</button>
      </div>

      <p id="resetError" class="login-error" role="alert" hidden></p>

      <p class="switch"><a href="index.html">Back to login</a></p>
    </main>

    <script type="module" src="/src/pages/resetPassword.js"></script>
  </body>
</html>
