<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Manage students, their results and their exam attempts." />
    <title>Users &amp; Records · Exam Portal</title>
    <link rel="icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/src/styles/style.css" />
  </head>
  <body class="app">
    <header class="app-bar">
      <div class="app-bar-inner">
        <a class="app-brand" href="admin.html">
          <span class="app-brand-mark" aria-hidden="true">EP</span>
          <span>Exam Portal</span>
        </a>
        <span class="app-section">Teacher</span>
        <nav class="app-nav" aria-label="Main">
          <a href="admin.html">Dashboard</a>
          <a href="users.html" aria-current="page">Users</a>
          <a href="results.html">Analysis</a>
        </nav>
        <div class="app-bar-right">
          <button type="button" class="app-logout" data-logout>Logout</button>
        </div>
      </div>
    </header>

    <main class="card dashboard-card analysis-card">
      <header class="page-header">
        <div>
          <p class="eyebrow">Teacher</p>
          <h1>Users &amp; Records</h1>
          <p class="sub">Everyone on the portal, and every mark and attempt they hold.</p>
        </div>

        <div class="header-actions">
          <button id="exportBtn" type="button" class="edit-btn">Export CSV</button>
          <button id="backBtn" type="button" class="secondary">Back to Admin</button>
        </div>
      </header>

      <div class="stats" id="userStats"></div>

      <div class="field filter-field">
        <label for="userSearch">Search</label>
        <input id="userSearch" type="search" placeholder="Filter by email or role" />
      </div>

      <div id="directoryState"></div>

      <div class="section-title">
        <h2>Everyone</h2>
        <span id="userCount">0 users</span>
      </div>
      <div id="userTable" class="table-scroll"></div>

      <section id="userDetail" hidden></section>
    </main>

    <footer class="credits-bar">
      2026 Made by <span class="name">Harshvardhan Dhankhar</span>
    </footer>

    <script type="module" src="/src/pages/users.js"></script>
  </body>
</html>
