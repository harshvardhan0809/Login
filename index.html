<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Sign in to the Exam Portal to take tests and review your results."
    />
    <title>Login · Exam Portal</title>
    <link rel="icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/src/styles/style.css" />
  </head>
  <body>
    <div id="loader" class="loader hidden" role="status" aria-live="polite">
      <div class="spinner-big"></div>
      <p>Logging you in...</p>
    </div>

    <main class="card auth-card">
      <div class="logo">Exam Portal</div>
      <h1>Welcome back</h1>
      <p class="sub">Sign in to continue your learning and assessments.</p>

      <form class="form-stack" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <div class="input-group">
            <span aria-hidden="true">@</span>
            <input
              id="email"
              type="email"
              placeholder="you@example.com"
              autocomplete="email"
              required
            />
          </div>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="input-group">
            <span aria-hidden="true">*</span>
            <input
              id="password"
              type="password"
              placeholder="Enter password"
              autocomplete="current-password"
              required
            />
          </div>
        </div>
      </form>

      <p class="forgot-row">
        <button id="forgotBtn" type="button" class="link-btn">Forgot password?</button>
      </p>

      <button id="loginBtn" type="button">Login</button>

      <p id="loginError" class="login-error" role="alert" hidden></p>

      <p class="secure">Secure student login</p>

      <p class="switch">
        Don't have an account?
        <a href="signup.html">Create an account</a>
      </p>

      <p class="made-by">
        Made by
        <a href="https://github.com/manuharsh08" target="_blank" rel="noreferrer" class="author">
          Harshvardhan Dhankhar
        </a>
      </p>
    </main>

    <script type="module" src="/src/pages/login.js"></script>
  </body>
</html>
