<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Your assigned tests and past results." />
    <title>Dashboard · Exam Portal</title>
    <link rel="icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/src/styles/style.css" />
  </head>
  <body>
    <a class="profile-menu" href="profile.html" aria-label="Open profile settings">
      <img id="profileIcon" class="profile-icon" alt="Your profile picture" />
    </a>

    <main class="card dashboard-card">
      <header class="page-header">
        <div>
          <p class="eyebrow">Student Dashboard</p>
          <h1 id="welcomeText">Welcome!</h1>
          <p class="sub">Track assigned tests, start new attempts, and review your scores.</p>
        </div>
      </header>

      <div id="examAlert"></div>

      <nav class="tabs" role="tablist" aria-label="Dashboard sections">
        <button type="button" class="tab" role="tab" data-tab="notices" aria-selected="true">
          Notice Board
        </button>
        <button type="button" class="tab" role="tab" data-tab="videos" aria-selected="false">
          Video Lessons
        </button>
        <button type="button" class="tab" role="tab" data-tab="assignments" aria-selected="false">
          Assignments
        </button>
        <button type="button" class="tab" role="tab" data-tab="tests" aria-selected="false">
          Tests
        </button>
        <button type="button" class="tab" role="tab" data-tab="results" aria-selected="false">
          My Results
        </button>
      </nav>

      <section id="panel-notices" role="tabpanel">
        <div class="section-title">
          <h2>Notice Board</h2>
          <span id="noticesCount">0 notices</span>
        </div>
        <div id="noticesList"></div>
      </section>

      <section id="panel-videos" role="tabpanel" hidden>
        <div class="section-title">
          <h2>Video Lessons</h2>
          <span id="videosCount">0 videos</span>
        </div>
        <div class="field filter-field">
          <label for="videoSearch">Search lessons</label>
          <input id="videoSearch" type="search" placeholder="Filter by title or subject" />
        </div>
        <div id="videosList"></div>
      </section>

      <section id="panel-assignments" role="tabpanel" hidden>
        <div class="section-title">
          <h2>Assignments</h2>
          <span id="assignmentsCount">0 assignments</span>
        </div>
        <div id="assignmentsList"></div>
      </section>

      <section id="panel-tests" role="tabpanel" hidden>
        <div class="section-title">
          <h2>Available Tests</h2>
          <span id="testsCount">0 pending</span>
        </div>
        <div id="testsList"></div>
      </section>

      <section id="panel-results" role="tabpanel" hidden>
        <div class="section-title">
          <h2>Previous Results</h2>
          <span id="resultsCount">0 attempts</span>
        </div>
        <div id="resultsList"></div>
      </section>

      <button type="button" class="secondary" data-logout>Logout</button>
    </main>

    <footer class="credits-bar">
      2026 Made by <span class="name">Harshvardhan Dhankhar</span>
    </footer>

    <script type="module" src="/src/pages/dashboard.js"></script>
  </body>
</html>
