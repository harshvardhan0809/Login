<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Create your Exam Portal student account." />
    <title>Create Account · Exam Portal</title>
    <link rel="icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/src/styles/style.css" />
  </head>
  <body>
    <main class="card auth-card">
      <div class="logo">Exam Portal</div>
      <h1>Create Account</h1>
      <p class="sub">Set up your student profile in a minute.</p>

      <form class="form-stack" novalidate>
        <div class="field">
          <label for="name">Full Name</label>
          <input id="name" placeholder="Your name" autocomplete="name" required />
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input
            id="email"
            type="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
          />
        </div>

        <div class="field">
          <label for="mobile">Mobile Number</label>
          <input id="mobile" type="tel" placeholder="Optional" autocomplete="tel" />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input
            id="password"
            type="password"
            placeholder="At least 6 characters"
            autocomplete="new-password"
            required
          />
        </div>

        <div class="field">
          <input id="avatar" type="file" accept="image/*" hidden />
          <label for="avatar" class="upload-btn">Upload Profile Picture</label>
          <span id="fileName" class="file-name"></span>
        </div>
      </form>

      <button id="signupBtn" type="button">Sign Up</button>

      <p class="switch">
        Already have an account?
        <a href="index.html">Login</a>
      </p>
    </main>

    <script type="module" src="/src/pages/signup.js"></script>
  </body>
</html>
